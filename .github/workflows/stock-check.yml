name: Flipkart Stock Alert

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Manual trigger
  repository_dispatch:
    # Trigger from other workflows

jobs:
  check_stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Random delay (0-60 seconds)
        run: |
          DELAY=$((RANDOM % 61))
          echo "Sleeping for $DELAY seconds..."
          sleep $DELAY

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
        run: |
          python scripts/check_stock.py

      - name: Commit state change if needed
        if: always()
        run: |
          # Check if state.json changed
          if [ -n "$(git status --porcelain state.json)" ]; then
            echo "State changed, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state - $(date)" || echo "No changes to commit or commit failed"
          else
            echo "No state changes to commit"
          fi

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 1

      - name: Report failure
        if: failure()
        run: |
          echo "Stock check failed - check artifacts for screenshots"
          exit 1