name: Flipkart Stock Alert

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Manual trigger

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check_stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FK_ADDRESS: ${{ secrets.FK_ADDRESS }}
          HEADLESS: "true"
        run: |
          python scripts/check_stock.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit state change if needed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest changes first
          git pull --rebase origin main || true

          # Check if state.json actually changed
          if [ -n "$(git status --porcelain state.json)" ]; then
            echo "State changed, committing..."
            git add state.json
            git commit -m "Update stock state [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push failed"
          else
            echo "No state changes to commit"
          fi
